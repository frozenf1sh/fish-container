name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Root-only layer tests
        run: sudo env "PATH=$PATH" go test -v ./internal/image -run TestUnpackConvertsOverlayWhiteouts
      - name: Privileged Linux end-to-end tests
        run: |
          make build
          sudo env "PATH=$PATH" ./hack/e2e-linux.sh ./bin/fish-container
